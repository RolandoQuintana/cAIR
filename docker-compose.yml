version: '3.8'

services:
  backend:
    build: ./cair_backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-change-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AI_API_BASE_URL=${AI_API_BASE_URL:-https://api.openai.com/v1}
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    volumes:
      - ./cair_backend:/app
    depends_on:
      - db
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    build: ./cair_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_APP_NAME=cAir
    volumes:
      - ./cair_frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: alpine:latest
    command: /bin/sh -c "echo 'SQLite will be used as file-based database'"
    volumes:
      - ./cair_backend/db.sqlite3:/tmp/placeholder

volumes:
  backend_data: